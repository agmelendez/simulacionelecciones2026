# ==========================================
# Configuración de Headers de Seguridad
# Para diferentes servidores web
# ==========================================

# ==========================================
# NGINX Configuration
# ==========================================
# Agregar en el bloque server {} de nginx.conf
#
# server {
#     # Content Security Policy
#     add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
#
#     # Prevenir MIME type sniffing
#     add_header X-Content-Type-Options "nosniff" always;
#
#     # Protección XSS
#     add_header X-XSS-Protection "1; mode=block" always;
#
#     # Prevenir clickjacking
#     add_header X-Frame-Options "DENY" always;
#
#     # Referrer Policy
#     add_header Referrer-Policy "strict-origin-when-cross-origin" always;
#
#     # Permissions Policy
#     add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
#
#     # Strict Transport Security (HSTS)
#     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
#
#     # Remove server information
#     server_tokens off;
#     more_clear_headers Server;
#
#     # Forzar HTTPS
#     if ($scheme != "https") {
#         return 301 https://$server_name$request_uri;
#     }
#
#     # Proteger archivos sensibles
#     location ~ /\. {
#         deny all;
#         access_log off;
#         log_not_found off;
#     }
#
#     location ~ \.(git|env|config|ini|log|sh|sql)$ {
#         deny all;
#         access_log off;
#         log_not_found off;
#     }
# }

